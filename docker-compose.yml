version: "3.8"

# ── LOCAL DEV ONLY — just PostgreSQL ──────────────────────────────
# Use d:\New folder\docker-compose.yml for full-stack production run

services:
  postgres:
    image: postgres:16-alpine
    container_name: velson_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: velson-v1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velson-v1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: velson_pgdata
